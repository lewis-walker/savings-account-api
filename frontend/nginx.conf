server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: every unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or a deploy leaves browsers holding a
        # document that references hashed assets which no longer exist.
        add_header Cache-Control "no-store" always;
    }

    # Hashed filenames, so these are immutable by construction.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # The API, on the same origin.
    #
    # This is why there is no CORS configuration anywhere in this project. The browser
    # sees one origin, so there are no preflights, no Access-Control headers to get
    # wrong, and cookies would simply work if a refresh token were added later. Serving
    # the SPA from one host and calling an API on another is the arrangement that
    # creates all of those problems in the first place.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The correlation id is minted HERE, at the edge, not by the browser.
        #
        # This is the gateway's job: it sees every request, including the ones rejected
        # before they reach the application, so only an id issued here can join the
        # whole picture together. A browser is an untrusted client - whatever header it
        # sends is overwritten, which is also why the application validates the value
        # rather than trusting the hop. $request_id is nginx's own per-request unique
        # value and needs nothing configuring.
        proxy_set_header X-Correlation-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
