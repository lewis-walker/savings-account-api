# Serves the ops console, and proxies its API calls to the backend's MANAGEMENT port.
#
# The proxy is here so the console is same-origin with the API it calls: no CORS
# preflight, no wildcard Access-Control-Allow-Origin on an administrative endpoint.
# It is the same trick the customer frontend uses, pointed at a different port.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /actuator/ {
        proxy_pass http://backend:8081/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The correlation id is minted HERE, at the edge, not by the browser.
        #
        # This is the gateway's job: it sees every request, including the ones rejected
        # before they reach the application, so only an id issued here can join the
        # whole picture together. A browser is an untrusted client - whatever header it
        # sends is overwritten, which is also why the application validates the value
        # rather than trusting the hop. $request_id is nginx's own per-request unique
        # value and needs nothing configuring.
        proxy_set_header X-Correlation-Id $request_id;
        # The log tail is polled continuously; do not let anything cache it.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
}
