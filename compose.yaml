# git clone && docker compose up --build
#
# Nothing else is required on the machine. The backend image builds its own jar,
# so no JDK and no Gradle; Postgres and Redis come up beside it.

name: savings-account-api

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-savings}
      POSTGRES_USER: ${DB_USER:-savings}
      # Demo credentials, in the open on purpose so the stack starts with nothing
      # to configure. A real deployment takes these from a secret manager and the
      # database is not reachable from a developer's laptop at all.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-savings}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # pg_isready, not a sleep. depends_on below waits for this to pass, which is
      # what makes `up` work first time rather than most times.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-savings} -d ${DB_NAME:-savings}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-savings}
      DB_USER: ${DB_USER:-savings}
      DB_PASSWORD: ${DB_PASSWORD:-savings}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-8080}:8080"
      # The management port, published separately. In a real deployment this is bound
      # to an internal interface and never appears in a public ingress rule.
      - "${MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, and deliberately not the aggregate /actuator/health.
      #
      # Readiness reports whether *this instance* can accept traffic. It does not
      # include Postgres or Redis, and that is the decision rather than an
      # oversight: if it did, a shared database blip would fail readiness on every
      # instance at once, all of them would leave rotation, and callers would get
      # connection failures instead of the 503 problem document this service is
      # perfectly capable of returning. A partial outage would have been converted
      # into a total one.
      #
      # Dependency health is still visible - /actuator/health aggregates it and
      # reports DOWN - it just does not get containers killed.
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      # The JVM needs a moment. Without a start period the container is declared
      # unhealthy while it is still perfectly normally starting up.
      start_period: 45s
      retries: 20
    restart: unless-stopped

  # The customer-facing app. nginx serves the built SPA and proxies /api to the
  # backend, so the browser sees a single origin and this project contains no CORS
  # configuration at all.
  frontend:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # The operations console: feature flags and a live log tail.
  #
  # A separate app on a separate port, talking to the backend's management port,
  # because that is what it is in reality - nobody operates LaunchDarkly by calling
  # their own service. It is also why it is trivial: one HTML file, no build step.
  ops-console:
    build:
      context: ./ops-console
    ports:
      - "${OPS_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
