spring:
  application:
    name: savings-account-api

  datasource:
    # Overridden by the environment in Docker; these defaults are for running
    # against a local compose stack directly from an IDE.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/savings}
    username: ${DB_USER:savings}
    password: ${DB_PASSWORD:savings}
    hikari:
      # Fail a request that cannot get a connection rather than letting callers
      # queue up behind a dead database. Pairs with the circuit breaker.
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1   # start even if Postgres is not up yet

  jpa:
    # Never on in a deployed profile. show-sql prints the statements, and TRACE on
    # the bind logger prints the parameter values alongside them - which is every
    # value the rest of this configuration takes care to keep out of the logs.
    show-sql: false

    # Flyway owns the schema. ddl-auto beyond 'validate' would let Hibernate quietly
    # disagree with the migrations, and the constraints doing the real work here are
    # ones Hibernate would not generate anyway.
    hibernate:
      ddl-auto: validate
    # The open-session-in-view default keeps a database connection pinned for the
    # whole request, including view rendering, and turns lazy loading into
    # accidental queries from the serialisation layer. Off.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    deserialization:
      # Reject unknown properties rather than ignoring them. A client that sends
      # customerName - which this API does not accept, because the name comes from the
      # verified customer record - is told so, instead of watching it silently vanish.
      fail-on-unknown-properties: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms          # the cache must never be the slow part of a request
      connect-timeout: 500ms

features:
  # Stand-in for LaunchDarkly. A real deployment leaves this empty and takes values
  # from the flag service; this exists so the demo can be driven from the environment.
  #
  #   docker compose run -e FEATURES_ENABLED_REDIS-CACHE=false backend
  #
  enabled:
    redis-cache: ${FEATURE_REDIS_CACHE:true}

security:
  jwt:
    issuer: ${JWT_ISSUER:https://savings-account-api.local}
    audience: ${JWT_AUDIENCE:savings-account-api}
    # Short, because there is no revocation list. This value is exactly the window in
    # which a stolen token is useful.
    access-token-ttl: 15m
  demo:
    # Demo only. A real deployment has no token endpoint here at all - see
    # TokenController - so there is no password for this service to hold.
    password: ${DEMO_PASSWORD:demo-password}

management:
  server:
    # A separate port, not a path on the customer-facing one. Operational surfaces -
    # health detail, metrics, and a switch that changes how the service behaves - have
    # a different threat model from the account API and should not share an ingress
    # rule with it. Compose publishes this one; a real deployment binds it to an
    # internal interface.
    port: 8081

  endpoints:
    web:
      exposure:
        include: health,info,metrics,featureflags,logtail
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true         # /readiness and /liveness for compose healthchecks

logging:
  level:
    com.lewiswalker.savings: INFO
    # One line per request. Named rather than package-scoped so it can be turned
    # up or down on its own, and so it is obvious in a log aggregator.
    access: INFO

    # Who did what and what the answer was. Named separately because audit records
    # have their own audience, their own retention - five years for AML/CFT, seven
    # for tax - and in a real deployment their own appender writing somewhere
    # durable. Keeping them distinguishable is what makes that routing a
    # configuration change rather than a rewrite; and an engineer turning
    # application logging down during an incident cannot switch this off by accident.
    audit: INFO

    # Pinned, and this is a control rather than tidiness.
    #
    # Hibernate's EntityPrinter reflects over every field of an entity and prints it
    # when org.hibernate.orm.core is at DEBUG - customer name and nickname included.
    # It does not use the entity's own toString, so a careful toString does not help.
    #
    # An explicit level on a logger overrides the root level, so raising the root to
    # DEBUG during an incident - which is exactly when someone does it, under pressure,
    # in production - cannot switch this back on. Anyone who turns it on has to do so
    # deliberately, on this named logger.
    org.hibernate: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

  # %X pulls from the MDC, which CorrelationIdFilter populates per request.
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId:-no-correlation-id}] %-40.40logger{39} : %m%n%wEx"
